<!DOCTYPE html>
<html lang="en">
<script>
  async function getData() {
    const date = new Date()
    let dateFormat = "";
    if (date.getDate()<10) {
      dateFormat= "0"+date.getDate();
    } else {
      dateFormat= ""+date.getDate();
    }


    const url = `https://www.nytimes.com/svc/wordle/v2/${date.getFullYear()}-${(date.getMonth()+1)<10? "0"+(date.getMonth()+1) : date.getMonth()+1}-${dateFormat}.json`;
    console.log("hey guysss")
    console.log(url);
    try {
      const response = await fetch(url);
      if (!response.ok) {
        throw new Error(`Response status: ${response.status}`);
      }

      finalOutput= await response.json();
      console.log(finalOutput)
      console.log("json: "  + finalOutput.solution)
      document.getElementById("reference").innerHTML=finalOutput

    } catch (error) {
      console.error(error.message);
    }
  }
  getData()
</script>
<head>
  <meta charset="UTF-8">
  <title>Title</title>
</head>

</html>
