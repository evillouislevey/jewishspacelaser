<!DOCTYPE html>
<html lang="en">
<script>
  async function getData() {
    const date = new Date()

    const url = `https://www.nytimes.com/svc/wordle/v2/${date.getFullYear()}-${(date.getMonth()+1)<10? "0"+(date.getMonth()+1) : date.getMonth()+1}-${date.getDate()}.json`;
    console.log("hey asaaa")
    try {
      const response = await fetch(url);
      if (!response.ok) {
        throw new Error(`Response status: ${response.status}`);
      }
      finalOutput=response.json();
      console.log(finalOutput.solution)
      document.getElementById("reference").innerHTML=finalOutput

    } catch (error) {
      console.error(error.message);
    }
  }
  getData()
</script>
<head>
  <meta charset="UTF-8">
  <title>Title</title>
</head>

</html>
